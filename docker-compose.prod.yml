services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.production
    restart: unless-stopped
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env.production
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
